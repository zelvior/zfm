[workspace]
members = ["installer"]
exclude = ["vendor/regex-lite", "vendor/qrcodegen"]

[package]
name = "zfm"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "A lightweight native file manager"
authors = ["Zelvior Labs"]
license = "Apache-2.0"

[dependencies]
regex-lite = { path = "vendor/regex-lite", version = "=0.1.6" }
qrcodegen = { path = "vendor/qrcodegen", version = "=1.8.0" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
