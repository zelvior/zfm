name: Build and release

on:
  workflow_dispatch:
    inputs:
      vtag:
        description: 'Version tag to create or release (for example v0.0.1)'
        required: true
        type: string
      publish:
        description: 'Publish a release after all builds pass (uncheck for a test run)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      source: ${{ steps.tag.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select the commit to build
        id: tag
        shell: bash
        env:
          TAG: ${{ inputs.vtag }}
          SELECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./tests/release-tag.sh
          selection=$(./scripts/resolve-release-tag.sh "$TAG" --fallback "$SELECTED_COMMIT")
          read -r source commit <<< "$selection"
          echo "Building $source tag $TAG at $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

  linux:
    needs: validate
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - name: Build, test, and smoke-test on the Mint 19 base
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.vtag }}
        run: |
          set -euxo pipefail
          # Build with Ubuntu 18.04's glibc 2.27 rather than the runner's 2.35.
          docker run --rm -v "$PWD:/workspace" -w /workspace ubuntu:18.04 \
            bash scripts/ci-legacy-linux.sh "$TARGET" "$TAG"
      - name: Check shell scripts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          bash -n scripts/build-linux.sh scripts/ci-legacy-linux.sh scripts/package-deb.sh tests/build-script.sh tests/gui-smoke-linux.sh tests/package-deb.sh
          ./tests/build-script.sh
      - name: Test the setup program logic
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked -p zfm-installer
      - name: Package the installer
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euxo pipefail
          name="zfm-$TARGET"
          mkdir -p dist
          cp "build-output/$TARGET/zfm.deb" "dist/$name.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zfm-${{ matrix.target }}
          path: dist/zfm-${{ matrix.target }}.deb
          if-no-files-found: error

  windows:
    needs: validate
    name: Windows ${{ matrix.target }}
    runs-on: windows-2022
    env:
      # Rust 1.78 raised the Windows minimum to Windows 10. Static CRT avoids
      # requiring a separate VC++ redistributable on Windows 7.
      RUSTFLAGS: -C target-feature=+crt-static
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - name: Install Rust target
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.77.2 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add --toolchain 1.77.2 $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +1.77.2 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.77.2 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +1.77.2 test --locked --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.77.2 test --locked --target $env:TARGET -p zfm-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and package the installer
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.vtag }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo +1.77.2 build --release --locked --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/gui-smoke-windows.ps1 -Executable "target/$env:TARGET/release/zfm.exe"
          $name = "zfm-$env:TARGET"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          # The setup program embeds the release executable at build time.
          $env:ZFM_APP_BINARY = (Resolve-Path "target/$env:TARGET/release/zfm.exe").Path
          $env:ZFM_VERSION = $env:TAG
          cargo +1.77.2 build --release --locked --target $env:TARGET -p zfm-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path $PWD "dist/$name-setup.exe"
          Copy-Item "target/$env:TARGET/release/zfm-setup.exe" -Destination $installer
          & ./tests/installer-windows.ps1 -Installer $installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zfm-${{ matrix.target }}
          path: dist/zfm-${{ matrix.target }}-setup.exe
          if-no-files-found: error

  release:
    name: Publish release assets
    if: inputs.publish
    needs: [validate, linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.vtag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: zfm-*
          path: dist
          merge-multiple: true
      - name: Verify assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.vtag }}
          BUILT_COMMIT: ${{ needs.validate.outputs.commit }}
          TAG_SOURCE: ${{ needs.validate.outputs.source }}
        run: |
          set -euxo pipefail
          cd dist
          assets=(
            zfm-x86_64-unknown-linux-gnu.deb
            zfm-i686-unknown-linux-gnu.deb
            zfm-x86_64-pc-windows-msvc-setup.exe
            zfm-i686-pc-windows-msvc-setup.exe
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          ../scripts/ensure-release-tag.sh "$TAG" "$BUILT_COMMIT" "$TAG_SOURCE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --title "$TAG" "${prerelease[@]}" \
              --notes 'Installers only: run the Windows setup program for your architecture, or install the .deb on Linux. Automated builds target Ubuntu 18.04 / Mint 19 and Windows 7 SP1 or newer. Linux requires GTK 3 and libarchive. Both setup programs are built from this repository without a third-party installer framework, use the black-and-white ZFM interface, and install for the current user with an uninstaller. GUI startup is smoke-tested on hosted runners, not on the legacy operating systems; compatibility is not guaranteed. See the included README.'
          fi
          ../scripts/resolve-release-tag.sh "$TAG" "$BUILT_COMMIT"
          gh release upload "$TAG" "${assets[@]}" SHA256SUMS.txt --clobber
