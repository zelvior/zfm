name: CI

# Builds and tests both interfaces on every push to main and every pull
# request. The installer package is compiled for Windows here, so a change that
# only breaks the Win32 wizard or setup program fails before a release run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check legal inventory and Debian packaging
        run: |
          python3 tests/legal-check.py
          bash tests/package-deb.sh
      - name: Install Rust
        run: |
          rustup toolchain install 1.77.2 --profile minimal
          rustc +1.77.2 --version
      - name: Test
        run: |
          cargo +1.77.2 test --locked
          cargo +1.77.2 test --locked -p zfm-installer
      - name: Build
        run: cargo +1.77.2 build --release --locked
      - name: GTK interaction smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 xvfb xdotool
          if ! xvfb-run -a ./tests/gui-smoke-linux.sh "$PWD/target/release/zfm" > /tmp/zfm-gui-smoke.log 2>&1; then
            cat /tmp/zfm-gui-smoke.log
            message=$(tail -30 /tmp/zfm-gui-smoke.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=GTK smoke test::$message"
            exit 1
          fi
          cat /tmp/zfm-gui-smoke.log
          xvfb-run -a python3 ./tests/benchmark-linux.py "$PWD/target/release/zfm"

  windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    env:
      # Windows 7 SP1 has no UCRT update, so link the C runtime statically.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust target
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.77.2 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add --toolchain 1.77.2 $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +1.77.2 --version
      - name: Test
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +1.77.2 test --locked --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.77.2 test --locked --target $env:TARGET -p zfm-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and smoke-test the installer
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: v0.0.0-ci
        run: |
          $ErrorActionPreference = 'Stop'
          cargo +1.77.2 build --release --locked --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/gui-smoke-windows.ps1 -Executable "target/$env:TARGET/release/zfm.exe"
          try {
            & ./scripts/build-archive-engine.ps1 -Target $env:TARGET -Output "target/$env:TARGET/release/zfm-archive-engine.exe" *>&1 | Tee-Object -FilePath engine-build.log
          } catch {
            $message = ((Get-Content engine-build.log -Tail 30 | Out-String) + $_.Exception.Message) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=Archive engine build::$message"
            throw
          }
          $env:ZFM_ENGINE_BINARY = (Resolve-Path "target/$env:TARGET/release/zfm-archive-engine.exe").Path
          python ./scripts/prepare-pdfium.py $env:TARGET "target/$env:TARGET/pdfium"
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare bundled PDFium renderer.' }
          $env:ZFM_PDFIUM_BINARY = (Resolve-Path "target/$env:TARGET/pdfium/pdfium.dll").Path
          $env:ZFM_PDFIUM_NOTICES = (Resolve-Path "target/$env:TARGET/pdfium/pdfium-notices.txt").Path
          $env:ZFM_APP_BINARY = (Resolve-Path "target/$env:TARGET/release/zfm.exe").Path
          $env:ZFM_VERSION = $env:TAG
          cmd /c "cargo +1.77.2 build --release --locked --target $env:TARGET -p zfm-installer > installer-build.log 2>&1"
          $buildExit = $LASTEXITCODE
          Get-Content installer-build.log
          if ($buildExit -ne 0) {
            $message = ((Get-Content installer-build.log -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
            Write-Output "::error::Installer build failed: $message"
            exit $buildExit
          }
          try { & ./tests/installer-windows.ps1 -Installer "target/$env:TARGET/release/zfm-setup.exe" }
          catch {
            $message = ($_ | Out-String) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error::Installer smoke test failed: $message"
            throw
          }
